version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: build8now_postgres
    restart: always
    environment:
      POSTGRES_USER: build8_user
      POSTGRES_PASSWORD: build8_secret
      POSTGRES_DB: build8now_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U build8_user -d build8now_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
